spring.application.name=linkly

# --- Database ---
# Values come from environment variables; the part after ':' is a local-dev default.
# The password has no default on purpose: it must always be provided (see .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkly}
spring.datasource.username=${DB_USER:linkly}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection open during view rendering (we are a REST API).
spring.jpa.open-in-view=false

# --- Actuator ---
# Only expose the health endpoint for now (used by Docker healthchecks).
management.endpoints.web.exposure.include=health

# --- Links ---
# Public base of the short URLs we hand out ("shortUrl" in responses).
linkly.base-url=${LINKLY_BASE_URL:http://localhost:8080}

# Spring's own errors (malformed JSON, wrong HTTP method...) also answer with ProblemDetail JSON,
# so every error from the API has the same shape.
spring.mvc.problemdetails.enabled=true

# --- Valkey (cache) ---
spring.data.valkey.client-type=lettuce
spring.data.valkey.host=${VALKEY_HOST:localhost}
spring.data.valkey.port=${VALKEY_PORT:6379}
# Short timeouts: if Valkey hangs, a redirect waits at most ~200 ms, then falls back to Postgres.
spring.data.valkey.timeout=200ms
spring.data.valkey.connect-timeout=200ms
# Valkey is NOT the source of truth: the app stays healthy (and keeps redirecting) while Valkey is down.
management.health.valkey.enabled=false

# TTL = safety net. We evict on every write; the TTL only cleans up if an evict was missed.
linkly.cache.ttl=1h
# Short, so a "not found" marker can never hide a newly created link for long.
linkly.cache.not-found-ttl=60s

# --- Click counting (write-behind) ---
# How often buffered clicks move from Valkey to Postgres. Shorter = fresher numbers, more writes.
linkly.clicks.flush-interval=${CLICKS_FLUSH_INTERVAL:10s}

# --- API keys + rate limiting ---
# Required to call POST /api/keys (header X-Admin-Token). Empty = nobody can create keys.
linkly.admin-token=${ADMIN_TOKEN:}
# Token bucket per API key: bursts of up to 10 requests, then 1 new token every 6 s (= 10/min).
linkly.rate-limit.capacity=${RATE_LIMIT_CAPACITY:10}
linkly.rate-limit.refill-seconds=${RATE_LIMIT_REFILL_SECONDS:6}
