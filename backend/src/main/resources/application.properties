spring.application.name=linkly

# --- Database ---
# Values come from environment variables; the part after ':' is a local-dev default.
# The password has no default on purpose: it must always be provided (see .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkly}
spring.datasource.username=${DB_USER:linkly}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection open during view rendering (we are a REST API).
spring.jpa.open-in-view=false

# --- Actuator ---
# Only expose the health endpoint for now (used by Docker healthchecks).
management.endpoints.web.exposure.include=health
