name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # has Docker preinstalled, so Testcontainers works
    defaults:
      run:
        working-directory: backend   # monorepo: mvnw lives in backend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # reuses ~/.m2 until pom.xml changes

      # Compile, unit tests, Testcontainers integration tests, package.
      - name: Build and test
        run: ./mvnw -B verify
