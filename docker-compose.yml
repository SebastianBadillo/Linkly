# Start everything:  docker compose up -d --build
# Stop:              docker compose down      (add -v to also delete the database volume)
# Values come from .env (copy .env.example). The part after ":-" is a default for local use only.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkly}
      POSTGRES_USER: ${POSTGRES_USER:-linkly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkly}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives "down" + "up"
    healthcheck:
      # "Do you accept connections?" The app waits for this to pass.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose: only the app talks to Postgres, over the Compose network.

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]   # answers PONG when ready
      interval: 5s
      timeout: 3s
      retries: 10
    # No volume: it's a cache. Losing it on restart is fine, Postgres has the real data.
    # No "ports:" either: only the app talks to it.

  app:
    build: ./backend
    environment:
      # "postgres" = the service name above. Compose's DNS turns it into the container's IP.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-linkly}
      DB_USER: ${POSTGRES_USER:-linkly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-linkly}
      LINKLY_BASE_URL: ${LINKLY_BASE_URL:-http://localhost:8080}
      VALKEY_HOST: valkey
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # empty = nobody can create API keys (safe default)
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-10}
      RATE_LIMIT_REFILL_SECONDS: ${RATE_LIMIT_REFILL_SECONDS:-6}
      CLICKS_FLUSH_INTERVAL: ${CLICKS_FLUSH_INTERVAL:-10s}
    ports:
      - "${APP_PORT:-8080}:8080"   # host:container
    depends_on:
      postgres:
        condition: service_healthy   # wait for pg_isready, not just "container started"
      valkey:
        condition: service_healthy   # not strictly needed (we degrade to Postgres), but a cold start shouldn't log warnings

volumes:
  pgdata:
